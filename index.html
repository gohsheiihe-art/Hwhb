<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 NASMA - نسمة ليبيا (اللعبة الفعلية)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl; }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #money {
            background: rgba(0, 0, 0, 0.8);
            color: #4caf50;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 2px solid #4caf50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        #money span { color: #fff; font-weight: normal; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.7);
            font-size: 2rem;
            pointer-events: none;
            z-index: 50;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #interact-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #f5d68a;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            border: 1px solid #d4a848;
            display: none;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #controls-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #aaa;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.8rem;
            border: 1px solid #222;
            pointer-events: none;
            z-index: 100;
            text-align: left;
            line-height: 1.6;
        }
        #status-msg {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            border-right: 5px solid #d4a848;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-align: center;
        }
        #shop-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid #d4a848;
            z-index: 300;
            display: none;
            min-width: 300px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }
        #shop-panel h2 { color: #f5d68a; margin-bottom: 20px; }
        #shop-panel button {
            background: #d4a848;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            transition: 0.2s;
            pointer-events: auto;
        }
        #shop-panel button:hover { transform: scale(1.05); background: #f5d68a; }
        #shop-panel .close-btn {
            background: #333;
            color: #fff;
            margin-top: 20px;
        }
        #shop-panel .close-btn:hover { background: #555; }
        .vehicle-indicator {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: #4fc3f7;
            background: rgba(0,0,0,0.7);
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #4fc3f7;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- واجهة اللاعب -->
    <div id="ui">
        <div id="money">💰 <span id="money-amount">500</span> دينار</div>
        <div style="color:#888; background:rgba(0,0,0,0.6); padding:8px 18px; border-radius:20px; font-size:0.9rem; backdrop-filter:blur(4px);">
            🏙️ نسمة ليبيا
        </div>
    </div>

    <div id="crosshair">+</div>
    <div id="interact-hint">🔑 اضغط (E) للتفاعل</div>
    <div id="status-msg">مرحباً بك في نسمة!</div>
    <div class="vehicle-indicator" id="vehicle-indicator">🚗 وضع القيادة (اضغط F للنزول)</div>

    <!-- لوحة المحل -->
    <div id="shop-panel">
        <h2>🏪 المحل التجاري</h2>
        <p style="color:#aaa;">مرحباً بك! ماذا تشتري؟</p>
        <button onclick="buyItem('خبز', 10)">🍞 خبز (10 دينار)</button>
        <button onclick="buyItem('ماء', 5)">💧 ماء (5 دينار)</button>
        <button onclick="buyItem('بنزين', 30)">⛽ بنزين (30 دينار)</button>
        <br>
        <button class="close-btn" onclick="closeShop()">إغلاق المحل</button>
    </div>

    <div id="controls-info">
        <div>🎮 WASD : حركة</div>
        <div>🖱️ الماوس : دوران</div>
        <div>🚗 E : ركوب السيارة</div>
        <div>🚶 F : النزول من السيارة</div>
    </div>

    <!-- استيراد المكتبات -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ---------- الإعدادات الأساسية ----------
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // متغيرات اللعبة
        let money = 500;
        let isInVehicle = false;
        let currentVehicle = null;
        let playerSpeed = 0.12;
        let vehicleSpeed = 0.25;

        // عناصر UI
        const moneySpan = document.getElementById('money-amount');
        const hintDiv = document.getElementById('interact-hint');
        const statusDiv = document.getElementById('status-msg');
        const vehicleIndicator = document.getElementById('vehicle-indicator');
        const shopPanel = document.getElementById('shop-panel');

        // دالة لتحديث الفلوس
        window.updateMoney = (amount) => {
            money += amount;
            if (money < 0) money = 0;
            moneySpan.textContent = money;
            showStatus(amount > 0 ? `+${amount} دينار` : `${amount} دينار`);
        };

        // دالة شراء
        window.buyItem = (item, price) => {
            if (money >= price) {
                updateMoney(-price);
                showStatus(`🛒 تم شراء ${item} بنجاح!`);
            } else {
                showStatus('❌ رصيدك غير كافٍ!');
            }
        };

        window.closeShop = () => {
            shopPanel.style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
        };

        function showStatus(msg) {
            statusDiv.textContent = msg;
            statusDiv.style.opacity = '1';
            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(() => { statusDiv.style.opacity = '0'; }, 2000);
        }

        // ---------- إنشاء المشهد ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 60);

        // الكاميرا (منظور ثالث)
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 8, -12);

        // المعروضات
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // معروض النصوص
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // ---------- الإضاءة ----------
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        sunLight.position.set(40, 50, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 50;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 80;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
        fillLight.position.set(-30, 10, -40);
        scene.add(fillLight);

        // ---------- الأرض والمدينة ----------
        // أرضية كبيرة
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xccb48c, roughness: 0.9 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        scene.add(ground);

        // طرق
        function createRoads() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
            // طريق دائري
            const ring = new THREE.Mesh(new THREE.RingGeometry(9, 11, 64), roadMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.01;
            ring.receiveShadow = true;
            scene.add(ring);

            // طرق شعاعية
            const angles = [0, 60, 120, 180, 240, 300];
            angles.forEach(deg => {
                const rad = deg * Math.PI / 180;
                const x = Math.sin(rad) * 12;
                const z = Math.cos(rad) * 12;
                const strip = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 10), roadMat);
                strip.rotation.x = -Math.PI / 2;
                strip.position.set(x, 0.01, z);
                strip.rotation.z = -rad;
                strip.receiveShadow = true;
                scene.add(strip);
            });
        }
        createRoads();

        // ---------- المناطق (المحلات) ----------
        const locations = [
            { name: '🏛️ نسمة المركز', x: 0, z: -14, color: 0xd4a848, size: 3 },
            { name: '🏡 نسمة الجديدة', x: 12.1, z: -7, color: 0x6a994e, size: 2.5 },
            { name: '🌾 أبو الغرب', x: 12.1, z: 7, color: 0xbc6c25, size: 2.5 },
            { name: '⛰️ رأس الطبل', x: 0, z: 14, color: 0x8d99ae, size: 2.5 },
            { name: '🏜️ مرسيط', x: -12.1, z: 7, color: 0xcd9777, size: 2.5 },
            { name: '⚡ المكمورة', x: -12.1, z: -7, color: 0x6c757d, size: 2.5 }
        ];

        const shopObjects = [];

        locations.forEach(loc => {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: loc.color, roughness: 0.6 });
            const building = new THREE.Mesh(new THREE.BoxGeometry(loc.size, loc.size * 0.9, loc.size), mat);
            building.position.y = loc.size * 0.45;
            building.castShadow = true;
            building.receiveShadow = true;
            group.add(building);

            // سقف
            const roof = new THREE.Mesh(new THREE.BoxGeometry(loc.size * 0.95, 0.1, loc.size * 0.95), 
                new THREE.MeshStandardMaterial({ color: 0xe0e0e0 }));
            roof.position.y = loc.size * 0.95;
            group.add(roof);

            // نخيل
            for (let i = 0; i < 2; i++) {
                const angle = (i / 2) * Math.PI * 2 + 0.5;
                const r = loc.size * 0.7;
                const px = Math.sin(angle) * r;
                const pz = Math.cos(angle) * r;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.8), 
                    new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                trunk.position.set(px, 0.4, pz);
                trunk.castShadow = true;
                group.add(trunk);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.5, 6), 
                    new THREE.MeshStandardMaterial({ color: 0x2d6a4f }));
                leaves.position.set(px, 0.9, pz);
                leaves.castShadow = true;
                group.add(leaves);
            }

            group.position.set(loc.x, 0, loc.z);
            scene.add(group);

            // تخزين موقع المحل للتفاعل
            shopObjects.push({
                name: loc.name,
                position: new THREE.Vector3(loc.x, 0, loc.z),
                radius: loc.size * 1.2
            });

            // تسمية
            const div = document.createElement('div');
            div.textContent = loc.name;
            div.style.color = '#fff';
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '2px 2px 10px rgba(0,0,0,0.9)';
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.padding = '4px 16px';
            div.style.borderRadius = '20px';
            div.style.border = '2px solid #d4a848';
            div.style.backdropFilter = 'blur(4px)';
            const label = new CSS2DObject(div);
            label.position.set(loc.x, loc.size * 1.6, loc.z);
            scene.add(label);
        });

        // ---------- السيارات (قابلة للركوب) ----------
        const vehicleData = [
            { color: 0xff3333, x: 2, z: -4 },
            { color: 0x3333ff, x: -2, z: -4 },
            { color: 0x33ff33, x: 2, z: 4 },
            { color: 0xffff33, x: -2, z: 4 },
        ];
        const vehicles = [];

        function createVehicleMesh(color, x, z) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.6 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.25, 1.6), bodyMat);
            body.position.y = 0.25;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 0.8), 
                new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, metalness: 0.3 }));
            cabin.position.set(0, 0.5, -0.2);
            cabin.castShadow = true;
            group.add(cabin);

            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wPos = [[-0.45, 0.1, 0.6], [0.45, 0.1, 0.6], [-0.45, 0.1, -0.6], [0.45, 0.1, -0.6]];
            wPos.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                group.add(wheel);
            });

            // مصابيح أمامية
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffdd88, emissiveIntensity: 0.3 });
            const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.08), lightMat);
            l1.position.set(-0.25, 0.15, 0.85);
            group.add(l1);
            const l2 = new THREE.Mesh(new THREE.SphereGeometry(0.08), lightMat);
            l2.position.set(0.25, 0.15, 0.85);
            group.add(l2);

            group.position.set(x, 0.1, z);
            // دوران عشوائي
            group.rotation.y = Math.random() * Math.PI * 2;
            scene.add(group);
            return group;
        }

        vehicleData.forEach(v => {
            const mesh = createVehicleMesh(v.color, v.x, v.z);
            vehicles.push({
                mesh: mesh,
                position: new THREE.Vector3(v.x, 0.1, v.z),
                isOccupied: false
            });
        });

        // ---------- إنشاء اللاعب (شخصية قابلة للتحكم) ----------
        const playerGroup = new THREE.Group();
        // جذع
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2196F3, roughness: 0.4 });
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
        bodyMesh.position.y = 0.6;
        bodyMesh.castShadow = true;
        playerGroup.add(bodyMesh);
        // رأس
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf5d0a9 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), headMat);
        head.position.y = 1.15;
        head.castShadow = true;
        playerGroup.add(head);
        // قبعة (لمسة ليبية)
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.1, 8), 
            new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
        hat.position.y = 1.3;
        playerGroup.add(hat);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // ---------- متغيرات التحكم ----------
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0, mouseY = 0;
        let playerAngle = 0;
        let cameraAngleH = 0;
        let cameraAngleV = 0.5;

        // أحداث لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') keys[key] = true;
            if (key === 'e') handleInteract();
            if (key === 'f') exitVehicle();
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') keys[key] = false;
        });

        // أحداث الماوس (قفل المؤشر)
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                cameraAngleH -= e.movementX * 0.002;
                cameraAngleV -= e.movementY * 0.002;
                cameraAngleV = Math.max(0.1, Math.min(1.0, cameraAngleV));
            }
        });

        // ---------- نظام التفاعل ----------
        function handleInteract() {
            if (isInVehicle) return;

            const playerPos = playerGroup.position;

            // 1. فحص القرب من السيارات
            for (let v of vehicles) {
                if (v.isOccupied) continue;
                const dist = playerPos.distanceTo(v.position);
                if (dist < 3.0) {
                    enterVehicle(v);
                    return;
                }
            }

            // 2. فحص القرب من المحلات
            for (let shop of shopObjects) {
                const dist = playerPos.distanceTo(shop.position);
                if (dist < shop.radius + 1.5) {
                    openShop(shop.name);
                    return;
                }
            }

       // 2. فحص القرب من المحلات
            for (let shop of shopObjects) {
                const dist = playerPos.distanceTo(shop.position);
                if (dist < shop.radius + 1.5) {
                    openShop(shop.name);
                    return;
                }
            }

            showStatus('❌ لا يوجد شيء للتفاعل هنا');
        }

        function enterVehicle(vehicle) {
            isInVehicle = true;
            currentVehicle = vehicle;
            vehicle.isOccupied = true;
            vehicle.mesh.position.y = 0.1;
            playerGroup.visible = false; // نخفي اللاعب
            vehicleIndicator.style.display = 'block';
            showStatus('🚗 ركبت السيارة! استخدم WASD للقيادة.');
            hintDiv.style.display = 'none';
        }

        window.exitVehicle = function() {
            if (!isInVehicle) return;
            isInVehicle = false;
            if (currentVehicle) {
                currentVehicle.isOccupied = false;
                // نضع اللاعب بجانب السيارة
                const pos = currentVehicle.mesh.position.clone();
                pos.x += 1.5;
                pos.z += 1.5;
                playerGroup.position.copy(pos);
                playerGroup.visible = true;
                currentVehicle = null;
            }
            vehicleIndicator.style.display = 'none';
            showStatus('🚶 نزلت من السيارة');
        };

        function openShop(name) {
            document.getElementById('crosshair').style.display = 'none';
            shopPanel.style.display = 'block';
            shopPanel.querySelector('h2').textContent = `🏪 ${name}`;
            showStatus(`💰 مرحباً بك في ${name}`);
        }

        // تحديث المؤشر التفاعلي
        function updateInteractionHint() {
            if (isInVehicle) { hintDiv.style.display = 'none'; return; }
            const playerPos = playerGroup.position;
            let found = false;

            // فحص السيارات
            for (let v of vehicles) {
                if (v.isOccupied) continue;
                if (playerPos.distanceTo(v.position) < 3.0) {
                    hintDiv.textContent = '🚗 اضغط (E) لركوب السيارة';
                    hintDiv.style.display = 'block';
                    found = true;
                    break;
                }
            }

            if (!found) {
                for (let shop of shopObjects) {
                    if (playerPos.distanceTo(shop.position) < shop.radius + 1.5) {
                        hintDiv.textContent = '🏪 اضغط (E) لدخول المحل';
                        hintDiv.style.display = 'block';
                        found = true;
                        break;
                    }
                }
            }

            if (!found) hintDiv.style.display = 'none';
        }

        // ---------- حلقة اللعبة الرئيسية ----------
        function animate() {
            requestAnimationFrame(animate);

            const forward = new THREE.Vector3(-Math.sin(cameraAngleH), 0, -Math.cos(cameraAngleH));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);

            let moveX = 0, moveZ = 0;
            if (keys.w) { moveX += forward.x; moveZ += forward.z; }
            if (keys.s) { moveX -= forward.x; moveZ -= forward.z; }
            if (keys.a) { moveX -= right.x; moveZ -= right.z; }
            if (keys.d) { moveX += right.x; moveZ += right.z; }

            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 0) {
                moveX /= len;
                moveZ /= len;
            }

            const speed = isInVehicle ? vehicleSpeed : playerSpeed;

            if (!isInVehicle) {
                // تحريك اللاعب
                playerGroup.position.x += moveX * speed;
                playerGroup.position.z += moveZ * speed;
                // تدوير اللاعب باتجاه الحركة
                if (len > 0) {
                    const targetAngle = Math.atan2(moveX, moveZ);
                    playerGroup.rotation.y = targetAngle;
                }
                // تحديث الكاميرا (تتبع خلف اللاعب)
                const camDist = 8;
                const heightOffset = 6;
                const targetCamX = playerGroup.position.x - Math.sin(cameraAngleH) * camDist;
                const targetCamZ = playerGroup.position.z - Math.cos(cameraAngleH) * camDist;
                const targetCamY = heightOffset + cameraAngleV * 4;

                camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
                camera.lookAt(playerGroup.position.x, 1.2, playerGroup.position.z);

            } else {
                // قيادة السيارة
                if (currentVehicle) {
                    const angle = currentVehicle.mesh.rotation.y;
                    const dir = new THREE.Vector3(-Math.sin(angle), 0, -Math.cos(angle));
                    const rightDir = new THREE.Vector3(dir.z, 0, -dir.x);

                    let carMoveX = 0, carMoveZ = 0;
                    if (keys.w) { carMoveX += dir.x; carMoveZ += dir.z; }
                    if (keys.s) { carMoveX -= dir.x; carMoveZ -= dir.z; }
                    if (keys.a) { currentVehicle.mesh.rotation.y += 0.02; }
                    if (keys.d) { currentVehicle.mesh.rotation.y -= 0.02; }

                    const cLen = Math.sqrt(carMoveX * carMoveX + carMoveZ * carMoveZ);
                    if (cLen > 0) {
                        carMoveX /= cLen; carMoveZ /= cLen;
                        currentVehicle.mesh.position.x += carMoveX * speed;
                        currentVehicle.mesh.position.z += carMoveZ * speed;
                    }
                    // تحديث موقع السيارة في مصفوفة البيانات
                    currentVehicle.position.copy(currentVehicle.mesh.position);

                    // الكاميرا تتبع السيارة
                    const camDist = 7;
                    const heightOffset = 5;
                    const targetCamX = currentVehicle.mesh.position.x - Math.sin(cameraAngleH) * camDist;
                    const targetCamZ = currentVehicle.mesh.position.z - Math.cos(cameraAngleH) * camDist;
                    const targetCamY = heightOffset + cameraAngleV * 3;

                    camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
                    camera.lookAt(currentVehicle.mesh.position.x, 0.5, currentVehicle.mesh.position.z);
                }
            }

            // تحديث مؤشر التفاعل
            updateInteractionHint();

            // رسم المشهد
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // ---------- استجابة حجم الشاشة ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- تحريك السيارات الواقفة (لمسة واقعية) ----------
        setInterval(() => {
            if (!isInVehicle) {
                vehicles.forEach(v => {
                    if (!v.isOccupied) {
                        // هزاز بسيط
                        v.mesh.position.y = 0.1 + Math.sin(Date.now() * 0.003 + v.mesh.id) * 0.02;
                    }
                });
            }
        }, 100);

        // رسالة ترحيب
        setTimeout(() => showStatus('🌍 مرحباً بك في نسمة ليبيا! استكشف المدينة.'), 500);
        console.log('🎮 لعبة نسمة ليبيا تعمل! استخدم WASD والماوس للتحكم.');
    </script>
</body>
</html>
