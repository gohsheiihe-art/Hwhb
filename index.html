<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مولد القصيمات - ألف قصي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 2rem 2rem 3rem;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,0,0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        h1 {
            color: #f5e7b0;
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px #b8860b55, 0 0 0 1px #d4af37;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            text-align: center;
            color: #bbd9f0;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border-bottom: 1px dashed #c9a84c;
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .subtitle span {
            background: #2d4b66;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            color: #f5e7b0;
            font-weight: bold;
            border: 1px solid #d4af37;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 2rem 0 2.5rem;
        }
        .btn-generate {
            background: radial-gradient(circle at 30% 20%, #f7e05e, #d4a017);
            border: none;
            padding: 0.9rem 3.2rem;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1a2e;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a5d0e, 0 12px 28px #00000066;
            transition: all 0.07s ease;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffea9a;
        }
        .btn-generate:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5d0e, 0 10px 24px #00000077;
        }
        .btn-generate:hover {
            background: radial-gradient(circle at 30% 20%, #ffe87a, #dba520);
            scale: 1.02;
        }
        .btn-generate i {
            font-size: 1.9rem;
        }
        .counter-badge {
            background: #1f3a4e;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            color: #f5e7b0;
            font-size: 1.3rem;
            font-weight: 600;
            border: 1px solid #c9a84c;
            box-shadow: inset 0 2px 6px #00000077;
            backdrop-filter: blur(4px);
        }
        .counter-badge strong {
            color: #ffd966;
            font-size: 1.7rem;
            margin: 0 6px;
        }
        .grid-wrapper {
            background: #0b1a2eaa;
            border-radius: 36px;
            padding: 1.8rem 1.2rem;
            border: 1px solid #c9a84c44;
            box-shadow: inset 0 0 30px #00000066;
            max-height: 500px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .grid-wrapper::-webkit-scrollbar {
            width: 8px;
        }
        .grid-wrapper::-webkit-scrollbar-track {
            background: #142b3e;
            border-radius: 20px;
        }
        .grid-wrapper::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 20px;
            border: 1px solid #f5e7b0;
        }
        .qasima-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.8rem;
        }
        .qasima-card {
            background: #1e3a52;
            border-radius: 60px;
            padding: 0.45rem 0.2rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f5efd3;
            border: 1px solid #b4943c;
            box-shadow: 0 4px 0 #0a141f, 0 6px 12px #00000055;
            transition: 0.1s ease;
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
            background: linear-gradient(145deg, #1b364b, #13303f);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0.45rem 0.3rem;
        }
        .qasima-card:hover {
            background: #295573;
            border-color: #f5d742;
            transform: scale(1.02);
            color: #fff7d6;
            box-shadow: 0 4px 0 #b4943c, 0 8px 18px #00000099;
        }
        .footer-note {
            margin-top: 2rem;
            text-align: center;
            color: #aac2d9;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 1.8rem;
        }
        .footer-note .example {
            background: #1f3a4e;
            padding: 0.2rem 1.4rem;
            border-radius: 40px;
            border: 1px solid #d4af37;
            color: #f5e7b0;
        }
        .empty-state {
            color: #9bb7d0;
            text-align: center;
            padding: 2rem 0.5rem;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }
        @media (max-width: 600px) {
            .container { padding: 1rem 1rem 2rem; }
            h1 { font-size: 2rem; }
            .btn-generate { padding: 0.7rem 2rem; font-size: 1.3rem; }
            .qasima-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .qasima-card { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚜️ مَوْلِدُ القَصِيمَاتِ ⚜️</h1>
    <div class="subtitle">
        <span>✦ هادي ✦</span> 
        <span style="background:transparent; border:none; color:#d4c28c;">مثلها · لكن ألف</span>
        <span style="background:#2d4b66;">١٠٠٠ قَصِي</span>
    </div>

    <div class="control-panel">
        <button class="btn-generate" id="generateBtn">
            <span>✦</span> أَنْشِئِ الْأَلْفَ <span>✦</span>
        </button>
        <div class="counter-badge">
            <span>👑</span> <strong id="countDisplay">0</strong> <span>/ ١٠٠٠</span>
        </div>
    </div>

    <div class="grid-wrapper" id="gridWrapper">
        <div class="qasima-grid" id="qasimaGrid">
            <div class="empty-state">
                <i>🌟</i>
                اضغط "أنشئ الألف" لتظهر القصيمات
            </div>
        </div>
    </div>

    <div class="footer-note">
        <span class="example">🔹 هادي 🔹 ريم 🔹 سيف 🔹 نور 🔹</span>
        <span>~ كل قصي مستوحى من "هادي" ~</span>
        <span>⚡ ١٠٠٠ اسم فريد</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ------------------- مستودع الأسماء (مثل هادي) -------------------
        const namePool = [
            "هادي", "سامي", "نوري", "رامي", "زين", "ليان", "جودي", "تالا", "ريما", "سارة",
            "لينا", "ناديا", "ميرا", "جانا", "هيا", "دانا", "رنا", "لانا", "ماريا", "سلمى",
            "ياسمين", "جولي", "نورا", "هالة", "غادة", "منى", "روان", "جمانة", "سيرين", "لجين",
            "يارا", "ريان", "سندس", "آية", "ريم", "سجى", "ولاء", "إيمان", "حنان", "رغد",
            "شهد", "بتول", "تقوى", "براءة", "عهد", "وئام", "نضال", "حكمت", "جهاد", "نبال",
            "علياء", "بثينة", "رحاب", "سلاف", "مجد", "أمل", "نجوى", "هند", "عبير", "أريج",
            "فجر", "دجى", "ضحى", "شذى", "ندى", "بلسم", "غيث", "مطر", "زهرة", "سناء",
            "إياد", "باسل", "جاسر", "حازم", "رائد", "زياد", "ساهر", "شادي", "صخر", "طارق",
            "عمار", "غسان", "فراس", "قيس", "كرم", "لؤي", "مازن", "نائل", "وسام", "ياسر",
            "بدر", "تامر", "ثامر", "جابر", "حارث", "خالد", "ذياب", "راشد", "زاهر", "سعد",
            "شاكر", "صالح", "ضاري", "عبدو", "غازي", "فايز", "قاسم", "كامل", "لطفي", "مروان"
        ];

        // ------------------- أدوات توليد الأسماء -------------------
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // توليد قصي واحد (مستوحى من هادي)
        function generateOneQasima() {
            const base = getRandomItem(namePool);
            const suffixes = ["", "ة", "ي", "ان", "ون", "ين", "ا", "ات", "ية", "وي", "م", "ر", "ل", "ن", "ه", "و", "ء", "ئ"];
            const prefix = Math.random() > 0.65 ? ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "ه", "و", "ي"][Math.floor(Math.random() * 28)] : "";
            
            let suffix = getRandomItem(suffixes);
            // نضمن تنوعًا أكثر
            if (Math.random() > 0.7) suffix = suffix + getRandomItem(["ء", "ة", "ي"]);
            
            let candidate = prefix + base + suffix;
            // أحيانًا نضيف لمسة "هادي" حرفيًا
            if (Math.random() > 0.9) candidate = "هادي" + getRandomItem(["ة", "ان", "ون", "ي", "م"]);
            
            // لا نسمح بأن يزيد عن 12 حرفًا (للتجميل)
            if (candidate.length > 12) candidate = candidate.slice(0, 11) + getRandomItem(["ي", "ة", "م"]);
            
            return candidate;
        }

        // توليد قائمة فريدة (حسب الإمكان) بحجم n
        function generateUniqueQasimas(count) {
            const uniqueSet = new Set();
            const result = [];
            let attempts = 0;
            const maxAttempts = count * 20; // أمان ضد الحلقات اللانهائية

            while (result.length < count && attempts < maxAttempts) {
                attempts++;
                const newName = generateOneQasima();
                if (!uniqueSet.has(newName)) {
                    uniqueSet.add(newName);
                    result.push(newName);
                }
            }

            // إذا لم نصل للعدد المطلوب بسبب ندرة الأسماء (مستبعد) نملأ بتكرارات مقبولة
            while (result.length < count) {
                const fallback = "هادي" + (result.length % 10) + getRandomItem(["ء", "ة", "ي", "ان"]);
                if (!uniqueSet.has(fallback)) {
                    uniqueSet.add(fallback);
                    result.push(fallback);
                } else {
                    // نضيف رقم عشوائي
                    const extra = "هادي" + Math.floor(Math.random() * 999);
                    if (!uniqueSet.has(extra)) {
                        uniqueSet.add(extra);
                        result.push(extra);
                    }
                }
            }
            return result;
        }

        // ------------------- عرض القصيمات في الشبكة -------------------
        const grid = document.getElementById('qasimaGrid');
        const countDisplay = document.getElementById('countDisplay');
        const generateBtn = document.getElementById('generateBtn');

        function renderQasimas(namesArray) {
            grid.innerHTML = '';
            if (!namesArray || namesArray.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i>🌙</i> لا قصيمات .. اضغط للإنشاء</div>`;
                countDisplay.textContent = '0';
                return;
            }

            const fragment = document.createDocumentFragment();
            namesArray.forEach(name => {
                const card = document.createElement('div');
                card.className = 'qasima-card';
                card.textContent = name;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
            countDisplay.textContent = namesArray.length;
        }

        // توليد ١٠٠٠ قصي وتحديث الواجهة
        function generateAndDisplay() {
            const count = 1000;
            const qasimas = generateUniqueQasimas(count);
            renderQasimas(qasimas);

            // تمرير سلس إلى أعلى الشبكة (اختياري)
            const wrapper = document.getElementById('gridWrapper');
            if (wrapper) {
                wrapper.scrollTop = 0;
            }
        }

        // ------------------- حدث الزر -------------------
        generateBtn.addEventListener('click', generateAndDisplay);

        // ------------------- تحميل أولي (عند فتح الصفحة) -------------------
        // نعرض ١٠٠٠ مباشرة كتجربة أولى
        window.addEventListener('load', function() {
            generateAndDisplay();
        });

    })();
</script>
</body>
  </html>
