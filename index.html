<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 NASMA - نسمة ليبيا (النموذج التفاعلي)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl; }
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #f5d68a;
            padding: 15px 30px;
            border-radius: 15px;
            border-right: 5px solid #d4a848;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #info h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        #info p {
            margin: 5px 0 0;
            color: #aaa;
            font-size: 0.9rem;
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.6);
            color: #888;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            backdrop-filter: blur(3px);
            border: 1px solid #222;
            pointer-events: none;
            z-index: 100;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a848;
            font-size: 2rem;
            z-index: 200;
            background: rgba(0,0,0,0.9);
            padding: 30px 60px;
            border-radius: 20px;
            border: 2px solid #d4a848;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🌍 نسمة ليبيا (NASMA)</h1>
        <p>النموذج الأولي · 6 مناطق · عالم مفتوح بلا تحميل</p>
    </div>
    <div id="controls-hint">🖱️ اسحب لتدوير · مرر لتكبير/تصغير</div>
    <div class="loading" id="loading">جاري تحميل نسمة...</div>

    <!-- استيراد Three.js والمكتبات المساعدة -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 1. تهيئة المشهد ---
        const scene = new THREE.Scene();
        // خلفية صحراوية بلون السماء الليبية
        scene.background = new THREE.Color(0x87CEEB); 

        // --- 2. الكاميرا (عين اللاعب) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 20, 35);
        camera.lookAt(0, 0, 0);

        // --- 3. المعروض (Renderer) ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 4. معروض النصوص (CSS2DRenderer) ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // نترك التفاعل للماوس مع OrbitControls
        document.body.appendChild(labelRenderer.domElement);

        // --- 5. التحكم (حرية الاستكشاف) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.3;
        controls.minDistance = 5;
        controls.maxDistance = 80;

        // --- 6. الإضاءة ---
        // إضاءة محيطية ناعمة
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // إضاءة رئيسية (شمس)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 40;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 60;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
        fillLight.position.set(-20, 10, -30);
        scene.add(fillLight);

        // --- 7. الأرض (صحراء نسمة) ---
        const groundGeometry = new THREE.CircleGeometry(50, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xccb48c, 
            roughness: 0.9,
            metalness: 0.0
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        scene.add(ground);

        // شبكة طرق (دائرية وخطوط)
        function createRoad() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
            // طريق رئيسي دائري
            const ring = new THREE.RingGeometry(9.5, 10.5, 64);
            const ringMesh = new THREE.Mesh(ring, roadMat);
            ringMesh.rotation.x = -Math.PI / 2;
            ringMesh.position.y = 0.01;
            ringMesh.receiveShadow = true;
            scene.add(ringMesh);

            // طرق شعاعية (توصيل المناطق)
            const angles = [0, 60, 120, 180, 240, 300].map(deg => deg * Math.PI / 180);
            angles.forEach(angle => {
                const x = Math.sin(angle) * 12;
                const z = Math.cos(angle) * 12;
                const roadStrip = new THREE.Mesh(
                    new THREE.PlaneGeometry(2, 8),
                    roadMat
                );
                roadStrip.rotation.x = -Math.PI / 2;
                roadStrip.position.set(x, 0.01, z);
                roadStrip.lookAt(0, 0, 0);
                roadStrip.rotateY(Math.PI / 2); 
                // تبسيط: نضعها بشكل يدوي
                roadStrip.position.set(x, 0.01, z);
                roadStrip.rotation.z = -angle;
                roadStrip.receiveShadow = true;
                scene.add(roadStrip);
            });
        }
        createRoad();

        // --- 8. إنشاء المناطق الست (محلات نسمة) ---
        const locations = [
            { name: '🏛️ نسمة المركز', x: 0, z: -12, color: 0xd4a848, size: 2.5 },
            { name: '🏡 نسمة الجديدة', x: 10.4, z: -6, color: 0x6a994e, size: 2 },
            { name: '🌾 أبو الغرب', x: 10.4, z: 6, color: 0xbc6c25, size: 2 },
            { name: '⛰️ رأس الطبل', x: 0, z: 12, color: 0x8d99ae, size: 2 },
            { name: '🏜️ مرسيط', x: -10.4, z: 6, color: 0xcd9777, size: 2 },
            { name: '⚡ المكمورة', x: -10.4, z: -6, color: 0x6c757d, size: 2 }
        ];

        // دالة لإنشاء مباني المنطقة
        function createDistrict(data) {
            const group = new THREE.Group();
            const { x, z, color, name, size } = data;

            // المبنى الرئيسي
            const buildingMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.1 });
            const building = new THREE.Mesh(new THREE.BoxGeometry(size, size * 0.8, size), buildingMat);
            building.position.y = size * 0.4;
            building.castShadow = true;
            building.receiveShadow = true;
            group.add(building);

            // سقف مميز (بلون أفتح)
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(size * 0.9, 0.1, size * 0.9), roofMat);
            roof.position.y = size * 0.85;
            roof.castShadow = true;
            group.add(roof);

            // أعمدة أو تفاصيل صغيرة (نخيل)
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });
            for (let i = 0; i < 3; i++) {
                const angle = (i / 3) * Math.PI * 2;
                const palmX = Math.sin(angle) * (size * 0.8);
                const palmZ = Math.cos(angle) * (size * 0.8);
                
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.8), trunkMat);
                trunk.position.set(palmX, 0.4, palmZ);
                trunk.castShadow = true;
                group.add(trunk);

                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.5, 6), leafMat);
                leaves.position.set(palmX, 0.9, palmZ);
                leaves.castShadow = true;
                group.add(leaves);
            }

            group.position.set(x, 0, z);
            scene.add(group);

            // --- إضافة تسمية (Label) فوق المنطقة ---
            const div = document.createElement('div');
            div.textContent = name;
            div.style.color = '#fff';
            div.style.fontSize = '20px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '2px 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.7)';
            div.style.background = 'rgba(20,20,20,0.7)';
            div.style.padding = '6px 18px';
            div.style.borderRadius = '30px';
            div.style.border = '2px solid #d4a848';
            div.style.backdropFilter = 'blur(4px)';
            div.style.fontFamily = 'Segoe UI, Arial';
            div.style.pointerEvents = 'none';
            
            const label = new CSS2DObject(div);
            label.position.set(x, size * 1.5, z);
            scene.add(label);
        }

        locations.forEach(loc => createDistrict(loc));

        // --- 9. سيارات تتحرك على الطرق (لمسة حياة) ---
        const carColors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff, 0x33ffff];
        const cars = [];
        
        function createCar(color, angleOffset) {
            const group = new THREE.Group();
            // هيكل السيارة
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.6 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 1.2), bodyMat);
            body.position.y = 0.2;
            body.castShadow = true;
            group.add(body);
            
            // الكابينة
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, metalness: 0.3 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.6), cabinMat);
            cabin.position.set(0, 0.4, -0.15);
            cabin.castShadow = true;
            group.add(cabin);

            // عجلات
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const positions = [[-0.4, 0.1, 0.4], [0.4, 0.1, 0.4], [-0.4, 0.1, -0.4], [0.4, 0.1, -0.4]];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                group.add(wheel);
            });

            // موقع عشوائي على الدائرة
            const angle = Math.random() * Math.PI * 2;
            const radius = 9.5 + Math.random() * 0.5;
            group.position.set(Math.sin(angle) * radius, 0.1, Math.cos(angle) * radius);
            group.rotation.y = -angle + Math.PI/2;
            
            scene.add(group);
            cars.push({
                mesh: group,
                angle: angle,
                radius: radius,
                speed: 0.005 + Math.random() * 0.01,
                direction: Math.random() > 0.5 ? 1 : -1
            });
        }

        for (let i = 0; i < 12; i++) {
            createCar(carColors[i % carColors.length]);
        }

        // --- 10. مزارع وأشجار إضافية (إثراء البيئة) ---
        function addTrees() {
            const treeMatTrunk = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const treeMatLeaf = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 13 + Math.random() * 10;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;
                
                // نتجنب وضع الأشجار فوق الطرق مباشرة
                if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.4), treeMatTrunk);
                trunk.position.set(x, 0.2, z);
                trunk.castShadow = true;
                scene.add(trunk);

                const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.4, 4), treeMatLeaf);
                leaf.position.set(x, 0.6, z);
                leaf.castShadow = true;
                scene.add(leaf);
            }
        }
        addTrees();

        // --- 11. مؤثرات الطقس (سماء ديناميكية) ---
        let time = 0;
        function updateSky() {
            time += 0.001;
            // تغير لون السماء بين الأزرق والذهبي (غروب)
            const r = 0.5 + 0.5 * Math.sin(time * 0.1);
            const g = 0.6 + 0.4 * Math.sin(time * 0.1 + 0.5);
            const b = 0.7 + 0.3 * Math.sin(time * 0.1 + 1.0);
            scene.background = new THREE.Color(r, g * 0.8, b * 0.7);
            
            // تغير لون الإضاءة (شمس)
            const sunIntensity = 0.8 + 0.4 * Math.sin(time * 0.1 + 0.2);
            sunLight.intensity = Math.max(0.4, sunIntensity);
        }

        // --- 12. حلقة الرسم (تشغيل اللعبة) ---
        function animate() {
            requestAnimationFrame(animate);

            // تحريك السيارات
            cars.forEach(car => {
                car.angle += car.speed * car.direction;
                car.mesh.position.x = Math.sin(car.angle) * car.radius;
                car.mesh.position.z = Math.cos(car.angle) * car.radius;
                car.mesh.rotation.y = -car.angle + Math.PI/2;
            });

            // تحديث الطقس
            updateSky();

            // تحديث التحكم
            controls.update();

            // إخفاء شاشة التحميل
            document.getElementById('loading').style.opacity = '0';
            document.getElementById('loading').style.transition = 'opacity 1s';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);

            // الرسم
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // --- 13. استجابة لحجم الشاشة ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('🌍 نسمة ليبيا - العالم المفتوح يعمل الآن!');
    </script>
</body>
</html>
