<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مولد 1000 قصيمية رقمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', 'Tahoma', monospace;
        }
        body {
            background: linear-gradient(145deg, #0d1b2a, #1b2f44);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 2rem 2rem 3rem;
            border: 1px solid #f5c84255;
            box-shadow: 0 20px 50px #000000aa;
        }
        h1 {
            color: #f5e7b0;
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            text-shadow: 0 0 12px #d4af37aa;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
        }
        .sub {
            text-align: center;
            color: #b8d0e5;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border-bottom: 1px dashed #c9a84c;
            padding-bottom: 0.8rem;
        }
        .sub span {
            background: #2a4a66;
            padding: 0.2rem 1.5rem;
            border-radius: 40px;
            color: #f5e7b0;
            border: 1px solid #d4af37;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .btn-generate {
            background: radial-gradient(circle at 30% 20%, #f7e05e, #d4a017);
            border: none;
            padding: 0.9rem 3.5rem;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #0b1a2e;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a5d0e, 0 12px 28px #00000099;
            transition: 0.07s ease;
            border: 1px solid #ffea9a;
            letter-spacing: 1px;
        }
        .btn-generate:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5d0e;
        }
        .btn-generate:hover {
            scale: 1.02;
            background: radial-gradient(circle at 30% 20%, #ffe87a, #dba520);
        }
        .counter {
            background: #1f3a4e;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            color: #f5e7b0;
            font-size: 1.3rem;
            font-weight: 600;
            border: 1px solid #c9a84c;
            box-shadow: inset 0 2px 8px #00000077;
        }
        .counter strong {
            color: #ffd966;
            font-size: 1.8rem;
            margin: 0 6px;
        }
        .grid-wrapper {
            background: #0b1a2ecc;
            border-radius: 30px;
            padding: 1.5rem 1rem;
            border: 1px solid #c9a84c44;
            max-height: 550px;
            overflow-y: auto;
            box-shadow: inset 0 0 40px #00000066;
        }
        .grid-wrapper::-webkit-scrollbar {
            width: 8px;
        }
        .grid-wrapper::-webkit-scrollbar-track {
            background: #142b3e;
            border-radius: 20px;
        }
        .grid-wrapper::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 20px;
            border: 1px solid #f5e7b0;
        }
        .qasima-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.7rem;
        }
        .qasima-card {
            background: #1e3a52;
            border-radius: 50px;
            padding: 0.5rem 0.3rem;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: #f5efd3;
            border: 1px solid #b4943c;
            box-shadow: 0 4px 0 #0a141f, 0 6px 12px #00000066;
            transition: 0.1s ease;
            letter-spacing: 0.5px;
            background: linear-gradient(145deg, #1b364b, #13303f);
            direction: ltr;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .qasima-card:hover {
            background: #295573;
            border-color: #f5d742;
            transform: scale(1.03);
            color: #fff7d6;
        }
        .empty-state {
            color: #9bb7d0;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #aac2d9;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .footer .example {
            background: #1f3a4e;
            padding: 0.2rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #d4af37;
            color: #f5e7b0;
            font-family: 'Courier New', monospace;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .btn-generate { padding: 0.6rem 1.8rem; font-size: 1.2rem; }
            .qasima-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .qasima-card { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔢 مَوْلِدُ الْقَصِيمَاتِ الرَّقْمِيَّةِ</h1>
    <div class="sub">
        <span>🎯 16 رَقْماً</span>
        <span style="background:transparent; border:none; color:#d4c28c;">مثل: 2031363908973952</span>
        <span style="background:#2a4a66;">١٠٠٠ قَصِيمِيَّة</span>
    </div>

    <div class="controls">
        <button class="btn-generate" id="generateBtn">🌀 أَنْشِئِ الْأَلْفَ</button>
        <div class="counter">
            <span>📊</span> <strong id="countDisplay">0</strong> <span>/ ١٠٠٠</span>
        </div>
    </div>

    <div class="grid-wrapper" id="gridWrapper">
        <div class="qasima-grid" id="qasimaGrid">
            <div class="empty-state">⏳ اضغط "أنشئ الألف" لظهور القصيمات</div>
        </div>
    </div>

    <div class="footer">
        <span class="example">2031363908973952</span>
        <span>✨ كل قصيمية فريدة</span>
        <span>🔄 تتغير بالضغط على الزر</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const grid = document.getElementById('qasimaGrid');
        const countDisplay = document.getElementById('countDisplay');

        // دالة توليد قصيمية رقمية عشوائية (16 رقم)
        function generateOneQasima() {
            let qasima = '';
            // الرقم الأول لا يكون 0 (لتبدو كرقم حقيقي)
            qasima += Math.floor(Math.random() * 9) + 1; // 1-9
            for (let i = 1; i < 16; i++) {
                qasima += Math.floor(Math.random() * 10); // 0-9
            }
            return qasima;
        }

        // توليد 1000 قصيمية فريدة
        function generateUniqueQasimas(count) {
            const uniqueSet = new Set();
            const result = [];
            let attempts = 0;
            const maxAttempts = count * 30;

            while (result.length < count && attempts < maxAttempts) {
                attempts++;
                const newQ = generateOneQasima();
                if (!uniqueSet.has(newQ)) {
                    uniqueSet.add(newQ);
                    result.push(newQ);
                }
            }

            // في حالة نادرة جداً جداً أن لم نصل للعدد المطلوب
            while (result.length < count) {
                const fallback = String(Math.floor(Math.random() * 10000000000000000)).padStart(16, '0');
                if (!uniqueSet.has(fallback)) {
                    uniqueSet.add(fallback);
                    result.push(fallback);
                }
            }
            return result;
        }

        // عرض القصيمات في الشبكة
        function renderQasimas(list) {
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="empty-state">📭 لا توجد قصيمات</div>`;
                countDisplay.textContent = '0';
                return;
            }

            const fragment = document.createDocumentFragment();
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'qasima-card';
                card.textContent = item;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
            countDisplay.textContent = list.length;
        }

        // الحدث الرئيسي: توليد 1000 وعرضها
        function generateAndDisplay() {
            const qasimas = generateUniqueQasimas(1000);
            renderQasimas(qasimas);
            // تمرير لأعلى الشبكة
            document.getElementById('gridWrapper').scrollTop = 0;
        }

        // ربط الزر
        document.getElementById('generateBtn').addEventListener('click', generateAndDisplay);

        // تحميل تلقائي عند فتح الصفحة
        window.addEventListener('load', generateAndDisplay);

    })();
</script>
</body>
</html>
